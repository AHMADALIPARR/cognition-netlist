<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
<rect width="760" height="460" fill="#0b1020"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb2d8"/></marker></defs>
<text x="20" y="26" fill="#e8eefc" font-family="sans-serif" font-size="17" font-weight="bold">Overload-recovery cycle and 2-qubit encoding</text>
<text x="20" y="448" fill="#9fb2d8" font-family="sans-serif" font-size="12">Deferred tokens in RECOVERY are buffered and drained on SYNC; nothing is lost.</text>
<rect x="60" y="90" width="130" height="64" rx="8" fill="#16213a" stroke="#37e0a0" stroke-width="2"/>
<text x="125" y="116" fill="#e8eefc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NORMAL</text>
<text x="125" y="138" fill="#9fb2d8" font-family="sans-serif" font-size="12" text-anchor="middle">qubits 00</text>
<line x1="192.0" y1="122.0" x2="228.0" y2="122.0" stroke="#9fb2d8" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="230" y="90" width="130" height="64" rx="8" fill="#16213a" stroke="#e0a037" stroke-width="2"/>
<text x="295" y="116" fill="#e8eefc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">OVERLOAD</text>
<text x="295" y="138" fill="#9fb2d8" font-family="sans-serif" font-size="12" text-anchor="middle">qubits 01</text>
<line x1="362.0" y1="122.0" x2="398.0" y2="122.0" stroke="#9fb2d8" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="400" y="90" width="130" height="64" rx="8" fill="#16213a" stroke="#e0a037" stroke-width="2"/>
<text x="465" y="116" fill="#e8eefc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RECOVERY</text>
<text x="465" y="138" fill="#9fb2d8" font-family="sans-serif" font-size="12" text-anchor="middle">qubits 10</text>
<line x1="532.0" y1="122.0" x2="568.0" y2="122.0" stroke="#9fb2d8" stroke-width="2.0" marker-end="url(#arr)"/>
<rect x="570" y="90" width="130" height="64" rx="8" fill="#16213a" stroke="#37e0a0" stroke-width="2"/>
<text x="635" y="116" fill="#e8eefc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NORMAL</text>
<text x="635" y="138" fill="#9fb2d8" font-family="sans-serif" font-size="12" text-anchor="middle">qubits 00</text>
<text x="210.0" y="82.0" fill="#9fb2d8" font-family="sans-serif" font-size="12" text-anchor="middle">NO_ACTION</text>
<text x="380.0" y="82.0" fill="#9fb2d8" font-family="sans-serif" font-size="12" text-anchor="middle">NO_ACTION</text>
<text x="550.0" y="82.0" fill="#9fb2d8" font-family="sans-serif" font-size="12" text-anchor="middle">SYNC</text>
<text x="20" y="220" fill="#e8eefc" font-family="sans-serif" font-size="15" font-weight="bold">2-qubit encoding</text>
<text x="20" y="250" fill="#37e0a0" font-family="monospace" font-size="13">00</text>
<text x="70" y="250" fill="#e8eefc" font-family="sans-serif" font-size="13" font-weight="bold">NORMAL</text>
<text x="190" y="250" fill="#9fb2d8" font-family="sans-serif" font-size="13">shift / reduce accepted</text>
<text x="20" y="280" fill="#37e0a0" font-family="monospace" font-size="13">01</text>
<text x="70" y="280" fill="#e8eefc" font-family="sans-serif" font-size="13" font-weight="bold">OVERLOAD</text>
<text x="190" y="280" fill="#9fb2d8" font-family="sans-serif" font-size="13">no valid action; flagged</text>
<text x="20" y="310" fill="#37e0a0" font-family="monospace" font-size="13">10</text>
<text x="70" y="310" fill="#e8eefc" font-family="sans-serif" font-size="13" font-weight="bold">RECOVERY</text>
<text x="190" y="310" fill="#9fb2d8" font-family="sans-serif" font-size="13">discard tokens until SYNC</text>
<text x="20" y="340" fill="#37e0a0" font-family="monospace" font-size="13">11</text>
<text x="70" y="340" fill="#e8eefc" font-family="sans-serif" font-size="13" font-weight="bold">ESCALATE</text>
<text x="190" y="340" fill="#9fb2d8" font-family="sans-serif" font-size="13">terminal; external help requested</text>
<text x="420" y="220" fill="#e8eefc" font-family="sans-serif" font-size="15" font-weight="bold">Grounding cues</text>
<text x="420" y="250" fill="#e8eefc" font-family="sans-serif" font-size="13">5 breaths / room change</text>
<text x="640" y="250" fill="#37e0a0" font-family="sans-serif" font-size="13">SYNC</text>
<text x="420" y="280" fill="#e8eefc" font-family="sans-serif" font-size="13">Call a friend</text>
<text x="640" y="280" fill="#37e0a0" font-family="sans-serif" font-size="13">ESCALATE_REQ</text>
<text x="420" y="310" fill="#e8eefc" font-family="sans-serif" font-size="13">60 s timeout</text>
<text x="640" y="310" fill="#37e0a0" font-family="sans-serif" font-size="13">TIMEOUT</text>
<text x="420" y="340" fill="#e8eefc" font-family="sans-serif" font-size="13">Unexpected stressor</text>
<text x="640" y="340" fill="#37e0a0" font-family="sans-serif" font-size="13">NO_ACTION</text>
<rect x="20" y="390" width="720" height="36" rx="8" fill="#16213a" stroke="#33415e" stroke-width="1"/>
<text x="380" y="413" fill="#9fb2d8" font-family="sans-serif" font-size="13" text-anchor="middle">RECOVERY buffers non-SYNC tokens; SYNC drains the buffer into NORMAL.</text>
</svg>
