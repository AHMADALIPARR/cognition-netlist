<text class="t" x="180" y="678">105 scenarios · 1,680 trials · perfect recall to 32 patterns</text>
<text class="mono" x="60" y="704">INTEGRITY_MANIFEST.txt</text>
<text class="t" x="240" y="704">12 files · bytes · lines · SHA-256 · byte-identical netlist regeneration</text>
<text class="small" x="60" y="730">This is a simulation artifact, not a biological consciousness model. No quantum effect is asserted. The Q#, Quipper, and Smalltalk modules are separate illustrations, connected to the core by naming and shared equations only.</text>

