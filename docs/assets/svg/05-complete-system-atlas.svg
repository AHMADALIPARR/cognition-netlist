<rect class="bg" width="1200" height="900"/>
<text class="title" x="600" y="52" text-anchor="middle">Cognition Netlist</text>
<text class="subtitle" x="600" y="76" text-anchor="middle">A 1,024-neuron analog polynomial state network · complete system atlas</text>

<!-- Top: mathematics -->
<rect class="panel-math" x="40" y="100" width="1120" height="110"/>
<text class="h" x="60" y="128">Mathematics — the governing layer</text>
<text class="eq" x="60" y="158">C dv/dt = -a v - b v^3 + g s</text>
<text class="eq" x="420" y="158">U(v) = 0.5 a v^2 + 0.25 b v^4 - g s v</text>
<text class="eq" x="820" y="158">P(x) = x^4 + x + 1</text>
<text class="t" x="60" y="186">Cubic cell · double well · equilibria -1, 0, +1 · s_crit = 2/(3 sqrt 3) = 0.38490018 · GF(2^4) · 8-regular graph, lambda_max = 5.26332 &lt; 2 sqrt 7 = 5.29150</text>

