<text class="center-t" x="600" y="414" text-anchor="middle" dy="0"></text>
<text class="cap" x="600" y="560" text-anchor="middle">Schematic only — the true graph is 8-regular on 1,024 vertices; this ring shows the idea, not the edges.</text>
<text class="t" x="400" y="580" text-anchor="middle">z = x + i y · r = x^2 + y^2 · gain = 0.2 (1 - r) · |z| relaxes to 1</text>
<text class="t" x="800" y="580" text-anchor="middle">1,015 of 1,024 have x &gt;= 0.999 · neuron 0 at x = 0.8918</text>

