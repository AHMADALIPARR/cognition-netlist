<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="title desc">
<title id="title">Cognition Netlist — Complete System Atlas</title>
<desc id="desc">A publication-quality atlas of the entire cognition-netlist-1024 system. At the center, the 1,024-neuron analog polynomial network. Around it, the four layers: mathematics, source and build, languages and runtime, and data and verification. The network diagram is schematic; the numbers, equations, and file names are taken from the repository.</desc>
